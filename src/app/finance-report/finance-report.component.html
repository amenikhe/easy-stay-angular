<div class="d-flex flex-column-reverse flex-lg-row">
  <!-- Sidebar -->
  <nav class="sidebar bg-orange p-3" style="width: 100%; max-width: 250px; height: 100vh; background-color: #ae9548; box-shadow: 2px 0 5px rgba(0,0,0,0.1);">
    <div class="d-flex align-items-center mb-4">
      <img src="assets/img/logo-easy-stay.PNG" alt="Logo" style="width: 50px; height: 50px; border-radius: 50%;">
      <h4 class="text-white ms-2">Admin Panel</h4>
    </div>

    <!-- Navigation -->
    <ul class="nav flex-column">
      <li class="nav-item mb-2">
        <a class="nav-link text-white d-flex align-items-center" routerLink="/gereruser">
          <span class="me-2">🧑</span>Client
        </a>
      </li>
      <li class="nav-item mb-2">
        <a class="nav-link text-white d-flex align-items-center" routerLink="/gestion-hotel">
          <span class="me-2">🏨</span>Hotel
        </a>
      </li>
      <li class="nav-item mb-2">
        <a class="nav-link text-white d-flex align-items-center" routerLink="/gestion-reservation">
          <span class="me-2">📅</span>Reservation
        </a>
      </li>
      <li class="nav-item mb-2">
        <a class="nav-link text-white d-flex align-items-center" routerLink="/offer">
          <span class="me-2">🎁</span>Offer
        </a>
      </li>
      <li class="nav-item mb-2">
        <a class="nav-link text-white d-flex align-items-center" routerLink="/finance-report">
          <span class="me-2">📊</span>Finance Report
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white d-flex align-items-center" routerLink="/login">
          <span class="me-2">⚙️</span>Logout
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main Content -->
  <div class="content p-4 flex-grow-1" style="background-color:rgb(250, 250, 249);">
    <div class="container">
      <h2 class="mb-4">Finance Report</h2>

      <!-- Static Content -->
      <div class="mb-4">
        <h4>Suggestions</h4>
        <ul>
          <li *ngFor="let suggestion of staticContent.suggestions">{{ suggestion }}</li>
        </ul>
      </div>

      <!-- Financial Reports Table -->
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>Month</th>
            <th>Revenue</th>
            <th>Expenses</th>
            <th>Profit</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let report of reports">
            <td>{{ report.month }}</td>
            <td>{{ report.revenue }}</td>
            <td>{{ report.expenses }}</td>
            <td>{{ report.profit }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
